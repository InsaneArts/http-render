<style>
/* Layout: one assembled diagram on a pannable, zoomable dotted canvas.
   URL keys on top; stems drop to parameter cards; the method feeds Headers and Body;
   the body travels to the server node and comes back as Status and Response. */
:root {
  --canvas: #eef0f3; --grid: #e2e6eb; --paper: #ffffff; --sunken: #f5f7f9;
  --ink: #12161c; --ink-2: #3a414c; --muted: #66707d; --faint: #a0a8b3; --line: #dfe3e8;

  --font-sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --edge: 0 2px 0 var(--line);
  --float: 0 18px 40px -18px rgb(10 14 20 / .28);
  --ease: cubic-bezier(.22, .8, .24, 1);
  --spring: cubic-bezier(.34, 1.5, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0d1014; --grid: #161a20; --paper: #151920; --sunken: #11151a;
    --ink: #e8ebef; --ink-2: #c0c6ce; --muted: #8a929d; --faint: #59616c; --line: #262b33;
    --path: #9d8cff; --query: #2cc2b5; --header: #ff7a45; --body: #6aa1ff; --ok: #3ccb7f; --err: #ff6b6b;
    --float: 0 18px 40px -18px rgb(0 0 0 / .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0d1014; --grid: #161a20; --paper: #151920; --sunken: #11151a;
  --ink: #e8ebef; --ink-2: #c0c6ce; --muted: #8a929d; --faint: #59616c; --line: #262b33;
  --path: #9d8cff; --query: #2cc2b5; --header: #ff7a45; --body: #6aa1ff; --ok: #3ccb7f; --err: #ff6b6b;
  --float: 0 18px 40px -18px rgb(0 0 0 / .7); color-scheme: dark;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--body); outline-offset: 2px; border-radius: 6px; }

.tile { display: inline-grid; place-items: center; flex-shrink: 0; width: 1.3em; height: 1.3em; border-radius: .32em; color: var(--c); font-style: normal;
  background: color-mix(in srgb, var(--c) 14%, var(--paper)); border: 1px solid color-mix(in srgb, var(--c) 34%, transparent); }
.tile svg { width: 64%; height: 64%; }
.key { --edge: color-mix(in srgb, var(--c, var(--ink)) 34%, var(--line)); display: inline-flex; align-items: center; gap: .4em; padding: .16em .55em .16em .26em; border: 0; border-radius: .42em;
  color: var(--c, var(--ink)); white-space: nowrap; background: var(--paper); font: 500 18px var(--font-mono);
  box-shadow: 0 0 0 1px var(--edge), 0 .17em 0 var(--edge); cursor: pointer; transition: transform .14s ease, box-shadow .14s ease, opacity .25s; }
.key:hover { transform: translateY(-.06em); box-shadow: 0 0 0 1px var(--edge), 0 .23em 0 var(--edge); }
.key:active { transform: translateY(.15em); box-shadow: 0 0 0 1px var(--edge), 0 .02em 0 var(--edge); }

/* Viewport + world */
.viewport { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, var(--canvas); }
.viewport.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1190px; padding: 30px 30px 40px; display: grid;
  grid-template-columns: 260px 350px 96px 340px; grid-template-rows: auto auto auto; column-gap: 28px; row-gap: 30px; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
.wires path { fill: none; stroke-width: 2; stroke-linecap: round; transition: opacity .25s, stroke-width .2s; }
.wires path.dash { stroke-dasharray: 2 6; }

.keys { grid-column: 1 / -1; grid-row: 1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 3px; z-index: 1; }
.keys .plain { font: 500 18px var(--font-mono); color: var(--faint); padding: 0 1px; }
.slots { grid-column: 1 / -1; grid-row: 2; position: relative; z-index: 1; }

/* Cards */
.card { position: relative; z-index: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--edge); cursor: pointer; align-self: start;
  transition: opacity .25s var(--ease), box-shadow .25s var(--ease), filter .25s; }
.card-h { display: flex; align-items: center; gap: 8px; padding: 11px 13px 9px; }
.card-h .tile { font-size: 15px; }
.card-h b { font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
.card-h .n { font: 11.5px var(--font-mono); color: var(--faint); }

.card-b { padding: 0 8px 10px; }
.card .more { display: none; }

.empty { margin: 2px 6px 4px; color: var(--muted); font-size: 13px; line-height: 1.5; }

.card-b.scroll { max-height: 520px; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.card.open .card-b.scroll { max-height: 620px; }

.grp.closed > .kids { display: none; }

.chip.muted { color: var(--muted); }
.card.open { z-index: 5; box-shadow: var(--edge), var(--float); cursor: default; }

.card .x { display: none; margin-left: 6px; width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 7px; background: var(--sunken); color: var(--muted); cursor: pointer; line-height: 1; }
.card.open .x { display: grid; place-items: center; }

.slot { position: absolute; top: 0; width: 200px; }
.slot .card-b { display: grid; gap: 4px; padding: 0 13px 12px; }
.slot .val { font: 500 13px var(--font-mono); color: var(--ink); overflow-wrap: anywhere; }
.slot .meta { color: var(--muted); font-size: 11.5px; }

.headers { grid-column: 1; grid-row: 3; }
.body { grid-column: 2; grid-row: 3; }
.server { grid-column: 3; grid-row: 3; align-self: start; justify-self: center; width: 150px; margin-top: 64px; display: grid; justify-items: center; gap: 8px; z-index: 1; cursor: pointer; }
.server .tile { font-size: 52px; border-radius: 14px; border-width: 1.5px; transition: transform .4s var(--spring); }

.server span { font-size: 11.5px; color: var(--muted); }
.rcol { grid-column: 4; grid-row: 3; display: grid; gap: 26px; align-content: start; }
.card.open { width: calc(100% + 370px); }
.card.right.open { margin-left: -370px; }
.slot.open { width: 300px; }

.hrow { display: grid; gap: 1px; padding: 5px 6px; border-radius: 9px; }
.hrow .hn { font: 500 12.5px var(--font-mono); color: var(--ink); }
.hrow .hv { font: 12px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.hrow .why { display: none; font-size: 12px; color: var(--ink-2); }
.card.open .hrow .why { display: block; }
.lock { display: inline-flex; margin-left: 6px; font: 10.5px var(--font-sans); color: var(--muted); padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); }

.verdict { display: flex; align-items: baseline; gap: 10px; padding: 0 14px 6px; }
.verdict .code { font: 500 44px/1 var(--font-mono); letter-spacing: -.025em; color: var(--res); }
.verdict .st { font-weight: 600; font-size: 15px; }
.verdict-why { padding: 0 14px 10px; color: var(--muted); font-size: 12.5px; }
.facts { display: flex; gap: 14px; padding: 0 14px 12px; color: var(--muted); font-size: 12px; }
.facts b { font: 500 12.5px var(--font-mono); color: var(--ink); }

/* Field tree */
.f { display: grid; grid-template-columns: minmax(0, auto) minmax(0, auto) minmax(0, 1fr); align-items: baseline; gap: 8px; padding: 3px 6px; border-radius: 7px; min-height: 25px; }
.f .nm { font: 500 12.5px var(--font-mono); white-space: nowrap; }
.f .nm .opt { margin-left: 5px; font: 10.5px var(--font-sans); color: var(--faint); }
.f .ty { font: 11.5px var(--font-mono); color: var(--faint); white-space: nowrap; }
.f .ty b { font-weight: 400; color: var(--muted); }
.f .ex { font: 11.5px var(--font-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f .ex.s { color: color-mix(in srgb, var(--ok) 80%, var(--ink)); }
.f .ex.z { color: var(--faint); }
.grp > .f .nm::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 6px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: translateY(-2px) rotate(45deg); }
.kids { margin-left: 13px; padding-left: 8px; border-left: 1.5px solid var(--line); }
.pill { font: 10.5px var(--font-sans); color: var(--muted); padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); }
.f, .hrow { --c: var(--body); }
.f:hover, .hrow:hover { background: color-mix(in srgb, var(--c) 10%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); }
.response .f, .status .hrow { --c: var(--res); } .headers .hrow { --c: var(--header); }

.json { display: none; font: 11.5px/1.7 var(--font-mono); white-space: pre; border-radius: 12px; background: var(--sunken); border: 1px solid var(--line); padding: 10px 12px; overflow: auto; max-height: 560px; }
.card.open .json { display: block; }
.jk { color: var(--ink); } .js { color: color-mix(in srgb, var(--ok) 80%, var(--ink)); } .jn { color: var(--body); } .jb { color: var(--path); } .jz, .jp { color: var(--faint); }

.world.focus .card:not(.hot), .world.focus .key:not(.hot), .world.focus .server:not(.hot) { opacity: .28; filter: saturate(.4); }
.world.focus .wires path:not(.hot), .world.focus .wires .lbl:not(.hot) { opacity: .12; }
.wires path.hot { stroke-width: 3; filter: drop-shadow(0 0 4px var(--glow)); }

/* Chrome */
.top { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; z-index: 10; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: inline-flex; align-items: center; gap: 9px; height: 36px; padding: 0 14px 0 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--edge); font-weight: 600; font-size: 14.5px; letter-spacing: -.02em; }

.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--edge); font-size: 13px; color: var(--muted); }
.chip b { font: 500 12.5px var(--font-mono); color: var(--ink); }

.bar { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 14px;
  background: var(--paper); border: 1px solid var(--line); box-shadow: var(--edge), var(--float); max-width: calc(100% - 24px); }
.bar button { height: 34px; padding: 0 12px; border: 1px solid transparent; border-radius: 10px; background: none; color: var(--ink-2); font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.bar button:hover { background: var(--sunken); border-color: var(--line); color: var(--ink); }
.bar button.ic { width: 34px; padding: 0; font-size: 17px; }
.bar .zoom { font: 500 12px var(--font-mono); color: var(--muted); min-width: 44px; text-align: center; }
.bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
.search { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--line); }
.search input { width: 150px; border: 0; outline: 0; background: none; font-size: 13.5px; }
.search small { font: 11px var(--font-mono); color: var(--muted); white-space: nowrap; }
.bar button.done { color: var(--ok); }

/* Assembly */
@media (prefers-reduced-motion: no-preference) {
  .boot .keys .key { animation: drop .6s var(--spring) both; animation-delay: calc(var(--i) * 60ms); }
  .boot .card, .boot .server { animation: slide .6s var(--ease) both; animation-delay: calc(var(--d) * 90ms + 500ms); }
  .boot .wires path:not(.dash) { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s var(--ease) forwards; animation-delay: calc(var(--d) * 90ms + 300ms); }
  .boot .wires path.dash { animation: fade .6s var(--ease) both; animation-delay: calc(var(--d) * 90ms + 300ms); }
  .boot .wires .lbl { animation: fade .4s var(--ease) both; animation-delay: 1.6s; }
}
@keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.85); } }
@keyframes slide { from { opacity: 0; transform: translateY(-16px) scale(.97); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } }

/* Phone: a stacked reference, no canvas */
@media (max-width: 760px) {
  body { overflow: auto; }
  .viewport { position: static; overflow: visible; cursor: auto; touch-action: auto; padding: 66px 12px 90px; min-height: 100%; }
  .world { position: static; transform: none !important; width: auto; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 14px; }
  .wires, .server { display: none; }
  .keys, .slots, .headers, .body, .rcol { grid-column: 1; grid-row: auto; }
  .keys .key, .keys .plain { font-size: 15px; }

  .card.right.open { margin-left: 0; }
  .card.open .split { grid-template-columns: minmax(0, 1fr); }
  .bar .zoom, .bar .ic, .bar .sep, #fit, #go-req, #go-res { display: none; }

  .top .chip:not(.status-chip) { display: none; }
}

const closeBtn = `<button type="button" class="x" aria-label="Close">×</button>`;

/* Any body: object, list, scalar, text, binary or a file reference. */

  const s = body.schema;
  if (s) {

      html = `<p class="listnote">A list of ${plural(n, "item")}. Each item has these fields:</p>${tree(s.items, Array.isArray(body.example) ? body.example[0] : undefined, "[]")}`;
      count = plural(n, "item");
    } else {
      const [t, cls] = exText(body.example, s);
      html = `<div class="f" data-s="value ${esc(t)}"><span class="nm">${s.type === "array" ? "items" : "value"}</span><span class="ty">${typeOf(s)}</span><span class="ex ${cls}">${esc(t)}</span></div>`;

function hostHtml(h) {

/* ---------- Build ---------- */
function build() {

/* Place parameter cards under their keys without overlapping. */
function placeSlots() {

  const k = scale;

  const slotsLeft = (slots.getBoundingClientRect().left - world.left) / k;
  let right = -Infinity, h = 0;
  slots.querySelectorAll(".slot").forEach((c) => {
    const key = document.querySelector(`[data-id="${CSS.escape(c.dataset.key)}"]`);
    const kr = key.getBoundingClientRect();
    const center = (kr.left + kr.width / 2 - world.left) / k - slotsLeft;
    const x = Math.max(center - 100, right + 14, 0);
    c.style.left = `${x}px`;
    right = x + 200;
    h = Math.max(h, c.offsetHeight);
  });
  const width = slots.offsetWidth, cards = [...slots.querySelectorAll(".slot")];
  let limit = width;
  for (const c of cards.reverse()) {
    const x = parseFloat(c.style.left);

/* ---------- Wires ---------- */
const links = [];

  };

function outId() {
  return $("c-body") ? "c-body" : $("c-headers") ? "c-headers" : "c-empty";

/* ---------- Pan & zoom ---------- */
let scale = 1, tx = 0, ty = 0;
const MIN = 0.35, MAX = 2;
function apply(animate) {

  world.style.transition = animate && !reduce ? "transform .45s cubic-bezier(.22,.8,.24,1)" : "";
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  $("zoom").textContent = `${Math.round(scale * 100)}%`;
}
function zoomAt(next, cx, cy, animate) {

const vp = $("viewport");
const pointers = new Map();
let drag = null, pinch = null, moved = false;
vp.addEventListener("pointerdown", (e) => {
  if (phone() || e.target.closest("button, input, .json, .raw, .card-b.scroll")) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, tx, ty };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: scale }; }

vp.addEventListener("pointerup", end);
vp.addEventListener("pointercancel", end);

  e.preventDefault();

$("zin").addEventListener("click", () => zoomAt(scale * 1.2, innerWidth / 2, innerHeight / 2, true));
$("zout").addEventListener("click", () => zoomAt(scale / 1.2, innerWidth / 2, innerHeight / 2, true));
$("fit").addEventListener("click", () => fit());
$("go-req").addEventListener("click", () => { collapse(); focusRegion(["keys", "slots", "c-headers", "c-body"]); });
$("go-res").addEventListener("click", () => { collapse(); focusRegion(["c-status", "c-response"]); });

/* ---------- Focus, expand ---------- */
function related(id) {
  const set = new Set([id]);
  links.forEach((l) => { if (l.a === id) set.add(l.b); if (l.b === id) set.add(l.a); });
  return set;
}
function setFocus(id) {
  const world = $("world");
  document.querySelectorAll(".hot").forEach((e) => e.classList.remove("hot"));
  if (!id) return world.classList.remove("focus");
  const set = related(id);
  world.classList.add("focus");
  set.forEach((x) => document.querySelector(`#${CSS.escape(x)}, [data-id="${CSS.escape(x)}"]`)?.classList.add("hot"));
  document.querySelectorAll(".wires [data-a]").forEach((p) => { if (p.dataset.a === id || p.dataset.b === id) p.classList.add("hot"); });
}
let open = null;
$("world").addEventListener("pointerover", (e) => {

  const t = e.target.closest(".card, .key, .server");
  setFocus(t ? t.id || t.dataset.id : null);
});
$("world").addEventListener("pointerleave", () => !open && setFocus(null));

  const anim = card.animate([{ width: `${a.width / scale}px`, height: `${a.height / scale}px` }, { width: `${b.width / scale}px`, height: `${b.height / scale}px` }], { duration: 380, easing: "cubic-bezier(.22,.8,.24,1)" });

}
function collapse() {

  const c = open;
  open = null;
  flip(c, () => c.classList.remove("open"));
  setFocus(null);
}
$("world").addEventListener("click", (e) => {
  if (moved) return;
  if (e.target.closest(".x")) return collapse();
  const key = e.target.closest(".key");
  if (key) {
    const target = key.dataset.id === "k-method" ? $(outId()) : key.dataset.id === "k-host" ? $("c-status") : document.querySelector(`[data-key="${CSS.escape(key.dataset.id)}"]`);
    if (target) expand(target);
    return;
  }
  if (e.target.closest(".server")) return playTrip();
  const groupHead = e.target.closest(".grp > .f");
  if (groupHead) {
    groupHead.parentElement.classList.toggle("closed");
    redrawSoon();
    return;
  }
  const card = e.target.closest(".card");
  if (card) expand(card);
  else collapse();
});
addEventListener("keydown", (e) => {
  if (e.key === "Escape") collapse();
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});

/* ---------- Round-trip packets ---------- */
function travel(a, b, color, delay) {
  return new Promise((done) => {
    const p = $("wires").querySelector(`path[data-a="${CSS.escape(a)}"][data-b="${CSS.escape(b)}"]`);
    if (!p || reduce || phone()) return done();
    setTimeout(() => {
      const len = p.getTotalLength();
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("r", "5");
      dot.setAttribute("fill", color);
      dot.style.filter = `drop-shadow(0 0 6px ${color})`;
      $("wires").appendChild(dot);
      const t0 = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - t0) / 750), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const pt = p.getPointAtLength(e * len);
        dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
        if (t < 1) requestAnimationFrame(step); else { dot.remove(); done(); }
      };
      requestAnimationFrame(step);
    }, delay);
  });
}
async function playTrip() {
  await travel(outId(), "c-server", mC, 0);
  $("c-server").classList.add("pulse");
  setTimeout(() => $("c-server").classList.remove("pulse"), 350);
  if (res) { await travel("c-server", "c-status", "var(--res)", 120); if ($("c-response")) await travel("c-status", "c-response", "var(--res)", 0); }
}

/* ---------- Search ---------- */
function search(q) {
  const world = $("world");
  document.querySelectorAll(".match, .has-match").forEach((e) => e.classList.remove("match", "has-match"));
  q = q.trim().toLowerCase();
  if (!q) { world.classList.remove("searching"); $("qn").textContent = ""; return []; }
  const hits = [...document.querySelectorAll("[data-s]")].filter((f) => !f.closest(".more") || f.closest(".open")).filter((f) => f.dataset.s.toLowerCase().includes(q));
  hits.forEach((f) => {
    f.classList.add("match");
    f.closest(".card")?.classList.add("has-match");
    for (let g = f.parentElement?.closest(".grp.closed"); g; g = g.parentElement?.closest(".grp.closed")) g.classList.remove("closed");
  });
  world.classList.add("searching");
  $("qn").textContent = hits.length ? `${hits.length}` : "none";
  return hits;
}
let hitIndex = 0;
$("q").addEventListener("input", (e) => { hitIndex = 0; search(e.target.value); });
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.target.value = ""; search(""); e.target.blur(); }
  if (e.key !== "Enter") return;
  const hits = search(e.target.value);
  if (!hits.length) return;
  const hit = hits[hitIndex++ % hits.length];
  if (phone()) return hit.scrollIntoView({ behavior: "smooth", block: "center" });
  const box = hit.closest(".card-b.scroll");
  if (box) box.scrollTop += (hit.getBoundingClientRect().top - box.getBoundingClientRect().top) / scale - 60;
  const w = $("world").getBoundingClientRect(), r = hit.getBoundingClientRect();
  const x = (r.left - w.left) / scale, y = (r.top - w.top) / scale;
  scale = 1.15;
  tx = innerWidth / 2 - (x + 120) * scale;
  ty = innerHeight / 2 - y * scale;
  apply(true);
});

/* ---------- Copy ---------- */
$("copy").addEventListener("click", async (e) => {
  const b = e.currentTarget;
  try { await navigator.clipboard.writeText(req.curl); b.textContent = "Copied"; b.classList.add("done"); }
  catch { b.textContent = "Copy blocked"; }
  setTimeout(() => { b.textContent = "Copy curl"; b.classList.remove("done"); }, 1400);
});

/* ---------- Start ---------- */
let redrawTimer = 0;
function redrawSoon() { cancelAnimationFrame(redrawTimer); redrawTimer = requestAnimationFrame(() => { placeSlots(); drawWires(); }); }
build();
const start = () => {
  apply();
  placeSlots();
  fit(false);
  drawWires();
  setTimeout(() => $("world").classList.remove("boot"), 2600);
  if (!reduce) setTimeout(playTrip, 2000);
};
(document.fonts ? document.fonts.ready : Promise.resolve()).then(start);
addEventListener("resize", () => { apply(); redrawSoon(); if (!phone()) fit(false); });
</script>
