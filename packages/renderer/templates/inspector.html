<style>
/* Layout: a centered 1180px window. Left: an outline of everything. Middle: the selected

:root {

  --path: #9d8cff; --query: #2cc2b5; --header: #ff7a45; --body: #6aa1ff; --ok: #3ccb7f; --err: #ff6b6b;

  padding: 18px max(20px, env(safe-area-inset-right)) 18px max(20px, env(safe-area-inset-left)); }

/* Top */
.top { display: flex; align-items: center; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: -.02em; margin-right: auto; }

.cols { display: grid; grid-template-columns: 270px minmax(0, 1fr) 360px; gap: 14px; min-height: 0; }

.snip { display: grid; gap: 6px; }
.snip > span { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.snip code { display: block; padding: 10px 12px; border-radius: 12px; background: var(--term); border: 1px solid var(--line); color: var(--term-ink); font: 12.5px/1.6 var(--font-mono); overflow-wrap: anywhere; letter-spacing: 0; }

.jl { padding: 0 16px; white-space: pre; cursor: pointer; transition: background-color .15s; }

    req.query.length && row("query", "var(--query)", "Query parameters", req.query.length, `query:${req.query[0].name}`),
    req.headers.length && row("header", "var(--header)", "Headers", req.headers.length, first("headers")),
    req.body && !kids(req.body.schema) ? row("body", "var(--body)", `${req.body.kind} body`, `${req.body.size} B`, first("body")) : count("body") && row("body", "var(--body)", "Body fields", count("body"), first("body")),
  ].filter(Boolean).join("");
  const resCard = res
    ? `<div class="sum res" style="--i:${n + 2}"><h3>You get back</h3><span class="big">${res.status}</span><span style="color:var(--muted)">${esc(res.statusText)}${res.timeMs != null ? ` · ${res.timeMs} ms` : ""} · ${res.size} B</span><ul>${count("rheaders") ? row("header", "var(--res)", "Headers", count("rheaders"), first("rheaders")) : ""}${res.body && !kids(res.body.schema) ? row("body", "var(--res)", `${res.body.kind} body`, `${res.body.size} B`, first("rbody")) : count("rbody") ? row("body", "var(--res)", "Body fields", count("rbody"), first("rbody")) : ""}</ul></div>`
    : `<div class="sum"><h3>You get back</h3><span style="color:var(--muted)">No response captured.</span></div>`;
  return `<div class="pane stagger"><h1 class="ov-h" style="--i:0">${esc(req.method)} ${esc(req.pathTemplate)}</h1><p class="ov-p" style="--i:1">Everything this endpoint takes and returns. Pick anything on the left, in the URL, or in the JSON to see what it is.</p>
    <div class="anatomy">${anatomy}</div>
    <div class="sums"><div class="sum" style="--i:${n + 1}"><h3>You send</h3><ul>${sendList || "<li>Nothing</li>"}</ul></div>${resCard}</div>
    <p class="tip" style="--i:${n + 3}"><kbd>↑</kbd> <kbd>↓</kbd> move through the list · <kbd>/</kbd> search · <kbd>esc</kbd> back to this overview</p></div>`;
}

/* ---------- Selection ---------- */
let selected = null;
function select(id, { scroll = true } = {}) {
  const it = id ? byId.get(id) : null;
  if (it && it.side && it.side !== side) { side = it.side; renderJson(); }
  if ((it?.kind === "status" || it?.kind === "rheader") && side !== "res") { side = "res"; renderJson(); }
  selected = it ? it.id : null;
  if (it) ancestors(it).forEach((a) => closed.delete(a));
  applyVisibility();

  const pane = $("detail");
  const old = pane.firstElementChild;
  pane.innerHTML = it ? detailItem(it) : overview();
  if (!reduce && old) pane.firstElementChild.animate([{ opacity: 0, transform: "translateY(10px) scale(.985)" }, { opacity: 1, transform: "none" }], { duration: 380, easing: "cubic-bezier(.34,1.3,.64,1)" });
  pane.scrollTop = 0;

  document.querySelectorAll(".sel").forEach((e) => e.classList.remove("sel"));
  if (it) {
    document.querySelectorAll(`[data-id="${CSS.escape(it.id)}"]`).forEach((e) => { if (!e.closest(".pane")) e.classList.add("sel"); });
    const line = document.querySelector(`.jl[data-id="${CSS.escape(it.id)}"]`);
    if (line && scroll) line.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    const c = document.querySelector(`#curl [data-id="${CSS.escape(it.id)}"]`);
    if (c && scroll) c.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
  }
  placeCursor(scroll);
}
function placeCursor(scroll) {
  const cur = $("cursor");
  const row = selected && document.querySelector(`.row[data-id="${CSS.escape(selected)}"]`);
  if (!row || row.hidden) { cur.style.opacity = 0; return; }
  cur.style.top = row.offsetTop + "px";
  cur.style.height = row.offsetHeight + "px";
  cur.style.setProperty("--c", byId.get(selected).color);
  cur.style.opacity = 1;
  if (scroll) row.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const tog = e.target.closest("[data-toggle]");
  if (tog) {
    e.stopPropagation();
    const id = tog.dataset.toggle;
    closed.has(id) ? closed.delete(id) : closed.add(id);
    applyVisibility();
    return;
  }
  const tab = e.target.closest(".tab");
  if (tab) { side = tab.dataset.side; renderJson(); select(selected, { scroll: false }); return; }
  const el = e.target.closest("[data-id]");
  if (el && !el.hasAttribute("data-noop")) select(el.dataset.id);
});
$("q").addEventListener("input", () => {
  applyVisibility();
  const firstMatch = [...document.querySelectorAll(".row")].find((r) => !r.hidden && $("q").value && r.querySelector(".nm").textContent.toLowerCase().includes($("q").value.toLowerCase()));
  if (firstMatch) select(firstMatch.dataset.id, { scroll: true });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); return; }
  if (e.key === "Escape") { if ($("q").value) { $("q").value = ""; applyVisibility(); } else select(null); $("q").blur(); return; }
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  if (document.activeElement && document.activeElement.matches("input") && document.activeElement !== $("q")) return;
  e.preventDefault();
  const rows = [...document.querySelectorAll(".row")].filter((r) => !r.hidden);
  const i = rows.findIndex((r) => r.dataset.id === selected);
  const next = rows[e.key === "ArrowDown" ? Math.min(rows.length - 1, i + 1) : Math.max(0, i === -1 ? 0 : i - 1)];
  if (next) select(next.dataset.id);
});
async function copyCurl(btn, label) {
  const text = $("curl").textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; btn.classList.add("done"); }
  catch { btn.textContent = "Copy blocked"; }
  setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1400);
}
$("copy").addEventListener("click", (e) => copyCurl(e.currentTarget, "Copy curl"));
$("copy2").addEventListener("click", (e) => copyCurl(e.currentTarget, "Copy"));
addEventListener("resize", () => placeCursor(false));

/* ---------- Start ---------- */
renderKeys();
renderOutline();
renderJson();
$("curl").innerHTML = curlHtml();
select(null);
</script>
